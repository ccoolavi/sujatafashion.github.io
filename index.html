<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujata Fashion - Shop & Rent</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Enhanced Styles for Product Display */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #eee;
        }
        
        .tab-button {
            padding: 15px 30px;
            background: none;
            border: none;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-button:hover {
            color: #667eea;
            background-color: #f0f0f0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }
        
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        
        .product-info {
            padding: 20px;
        }
        
        .product-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        
        .product-price {
            font-size: 1.4em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .product-category {
            font-size: 0.9em;
            color: #666;
            background-color: #f0f0f0;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .product-description {
            color: #666;
            font-size: 0.95em;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        
        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        
        .whatsapp-btn:hover {
            background: #1ebe57;
        }
        
        .loading, .error {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
        }
        
        .loading {
            color: #667eea;
        }
        
        .error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin: 20px;
        }
        
        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
            
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab-button {
                padding: 12px;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌟 Sujata Fashion 🌟</h1>
        <p>Shop Premium Fashion & Rent for Special Occasions</p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('shop')">
                🛍️ Shop Now
            </button>
            <button class="tab-button" onclick="switchTab('rent')">
                👗 Rent Now
            </button>
        </div>

        <div id="shop-content" class="tab-content active">
            <div id="shop-products" class="products-grid">
                <div class="loading">Loading shop products...</div>
            </div>
        </div>

        <div id="rent-content" class="tab-content">
            <div id="rent-products" class="products-grid">
                <div class="loading">Loading rental products...</div>
            </div>
        </div>
    </div>

    <script>
// Google Sheets API Configuration
const API_KEY = 'AIzaSyAWWpa4xPGR8aBWKqSq0oKOp6a0XELijh0';
const SPREADSHEET_ID = '1JT5j6xifWkRcaeZIDzQjhB1RArzFEyqxSLQxnAObfms';
const WHATSAPP_NUMBER = '+919763416561';

const SALE_RANGE = 'Sale!A:U';      
const RENTAL_RANGE = 'Rental!A:V';   

let shopProducts = [];
let rentalProducts = [];
let isLoading = false;

document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 Sujata Fashion - Loading products from Google Sheets');
    loadAllProducts();
});

function switchTab(tab) {
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
    });
    document.getElementById(tab + '-content').classList.add('active');
}

async function loadAllProducts() {
    if (isLoading) return;
    isLoading = true;
    
    try {
        await Promise.all([
            loadShopProducts(),
            loadRentalProducts()
        ]);
    } catch (error) {
        console.error('Error loading products:', error);
    } finally {
        isLoading = false;
    }
}

async function loadShopProducts() {
    try {
        const data = await fetchSheetData(SALE_RANGE);
        shopProducts = parseProductData(data, 'shop');
        displayProducts(shopProducts, 'shop-products');
        console.log(`✅ Loaded ${shopProducts.length} shop products`);
    } catch (error) {
        console.error('Error loading shop products:', error);
        showError('shop-products', 'Failed to load shop products');
    }
}

async function loadRentalProducts() {
    try {
        const data = await fetchSheetData(RENTAL_RANGE);
        rentalProducts = parseProductData(data, 'rent');
        displayProducts(rentalProducts, 'rent-products');
        console.log(`✅ Loaded ${rentalProducts.length} rental products`);
    } catch (error) {
        console.error('Error loading rental products:', error);
        showError('rent-products', 'Failed to load rental products');
    }
}

async function fetchSheetData(range) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?key=${API_KEY}`;
    const response = await fetch(url);
    if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    const result = await response.json();
    return result.values || [];
}

function parseProductData(data, type) {
    if (!data || data.length < 2) return [];
    
    const rows = data.slice(1);
    const products = [];
    
    rows.forEach((row, index) => {
        if (!row || row.length === 0) return;
        
        let product = {};
        
        if (type === 'shop') {
            product = {
                id: row[0],           // Column A: ProductID
                name: row[1],         // Column B: Name_en
                category: row[5],     // Column F: Category_en
                price: row[8],        // Column I: Price
                description: row[9],  // Column J: Description_en
                mainImage: row[12],   // Column M: MainImage
                type: type
            };
        } else if (type === 'rent') {
            product = {
                id: row[0],           // Column A: ProductID
                name: row[1],         // Column B: Name_en
                category: row[5],     // Column F: Category_en
                price: row[8],        // Column I: RentalPrice
                securityDeposit: row[9], // Column J: SecurityDeposit
                description: row[10], // Column K: Description_en
                mainImage: row[13],   // Column N: MainImage (FIXED!)
                type: type
            };
        }
        
        if (!product.id || !product.name) return;
        products.push(product);
    });
    
    return products;
}

function displayProducts(products, containerId) {
    const container = document.getElementById(containerId);
    
    if (!products || products.length === 0) {
        container.innerHTML = '<div class="error">No products available at the moment</div>';
        return;
    }
    
    container.innerHTML = products.map(product => `
        <div class="product-card" onclick="openProductDetails('${product.id}', '${product.type}')">
            <img 
                src="${product.mainImage}" 
                alt="${product.name}"
                class="product-image"
                onerror="this.src='https://via.placeholder.com/300x400?text=No+Image+Available'"
            >
            <div class="product-info">
                <div class="product-category">${product.category}</div>
                <h3 class="product-name">${product.name}</h3>
                <div class="product-price">
                    ${formatPrice(product.price)}
                    ${product.securityDeposit ? `<br><small>Security: ${formatPrice(product.securityDeposit)}</small>` : ''}
                </div>
                <p class="product-description">${truncateText(product.description, 80)}</p>
                <div class="product-actions" style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="view-details-btn" onclick="event.stopPropagation(); openProductDetails('${product.id}', '${product.type}')" style="flex: 1; padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 15px; font-size: 0.9em;">
                        👁️ Details
                    </button>
                    <button class="whatsapp-btn" onclick="event.stopPropagation(); inquireOnWhatsApp('${product.id}', '${product.type}')" style="flex: 1; padding: 8px 12px; background: #25D366; color: white; border: none; border-radius: 15px; font-size: 0.9em;">
                        💬 WhatsApp
                    </button>
                </div>
            </div>
        </div>
    `).join('');
    
    console.log(`✨ Displayed ${products.length} products in ${containerId}`);
}

function formatPrice(price) {
    if (!price || price === '0') return 'Price on Request';
    const cleanPrice = price.toString().replace(/[^\d.,]/g, '');
    const numericPrice = parseFloat(cleanPrice.replace(',', ''));
    if (isNaN(numericPrice)) return price;
    return `₹${numericPrice.toLocaleString('en-IN')}`;
}

function truncateText(text, maxLength) {
    if (!text || text.length <= maxLength) return text;
    return text.substring(0, maxLength).trim() + '...';
}

function openProductDetails(productId, type) {
    console.log('🔍 Opening product details for:', productId, type);
    window.location.href = `product.html?id=${productId}&type=${type}`;
}

function inquireOnWhatsApp(productId, type) {
    const allProducts = [...shopProducts, ...rentalProducts];
    const product = allProducts.find(p => p.id === productId);
    
    if (!product) {
        alert('Product not found');
        return;
    }
    
    const actionType = type === 'rent' ? 'rent' : 'purchase';
    const message = `Hi! I'm interested in this ${actionType} item from Sujata Fashion:

🛍️ Product: ${product.name}
🆔 ID: ${product.id}
💰 Price: ${formatPrice(product.price)}
${product.securityDeposit ? `💳 Security: ${formatPrice(product.securityDeposit)}` : ''}
📱 Category: ${product.category}

🖼️ Image: ${product.mainImage}

Could you please provide more details?

Thank you! 🙏`;

    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER.replace(/\D/g, '')}?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
}

function showError(containerId, message) {
    const container = document.getElementById(containerId);
    container.innerHTML = `
        <div class="error">
            <h3>⚠️ ${message}</h3>
            <button class="retry-btn" onclick="loadAllProducts()">🔄 Retry</button>
        </div>
    `;
}
</script>


</body>
</html>
