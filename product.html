<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="product-title-meta">Product Name - Sujata Fashion</title>
    
    <!-- Meta tags for social sharing -->
    <meta property="og:title" content="" id="og-title">
    <meta property="og:description" content="" id="og-description">
    <meta property="og:image" content="" id="og-image">
    <meta property="og:url" content="" id="og-url">
    <meta property="og:type" content="product">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="" id="twitter-title">
    <meta name="twitter:description" content="" id="twitter-description">
    <meta name="twitter:image" content="" id="twitter-image">
    
    <!-- Existing main.css styling -->
    <link rel="stylesheet" href="main.css">
    
    <style>
        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }
        
        .product-images {
            display: flex;
            flex-direction: column;
        }
        
        .main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .image-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        
        .gallery-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        
        .gallery-thumb:hover,
        .gallery-thumb.active {
            border-color: #007bff;
        }
        
        .product-info {
            padding: 20px 0;
        }
        
        .product-title {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #333;
        }
        
        .product-price {
            font-size: 2em;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .product-description {
            line-height: 1.6;
            margin-bottom: 30px;
            color: #666;
        }
        
        .share-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .share-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }
        
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
        }
        
        .whatsapp-btn:hover {
            background-color: #128c7e;
        }
        
        .facebook-btn {
            background-color: #1877f2;
            color: white;
        }
        
        .facebook-btn:hover {
            background-color: #166fe5;
        }
        
        .copy-btn {
            background-color: #6c757d;
            color: white;
        }
        
        .copy-btn:hover {
            background-color: #5a6268;
        }
        
        @media (max-width: 768px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .product-title {
                font-size: 2em;
            }
            
            .product-price {
                font-size: 1.5em;
            }
            
            .share-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation and header would go here -->
    
    <div class="product-container">
        <div class="product-layout">
            <!-- Product Images Section -->
            <div class="product-images">
                <img id="main-product-image" class="main-image" src="" alt="Product Image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAwIiBoZWlnaHQ9IjUwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPic=">
                
                <!-- Image Gallery Thumbnails -->
                <div id="image-gallery" class="image-gallery">
                    <!-- Gallery thumbnails will be populated by JavaScript -->
                </div>
            </div>
            
            <!-- Product Information Section -->
            <div class="product-info">
                <h1 id="product-title" class="product-title">Product Title Placeholder</h1>
                
                <div id="product-price" class="product-price">₹0.00</div>
                
                <div id="product-description" class="product-description">
                    <p>Product description will be populated here. This is a placeholder for the detailed product information that will be loaded dynamically.</p>
                </div>
                
                <!-- Share Buttons -->
                <div class="share-buttons">
                    <a href="#" id="whatsapp-share" class="share-btn whatsapp-btn" target="_blank">
                        📱 Share on WhatsApp
                    </a>
                    <a href="#" id="facebook-share" class="share-btn facebook-btn" target="_blank">
                        📘 Share on Facebook
                    </a>
                    <button id="copy-link" class="share-btn copy-btn">
                        🔗 Copy Link
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Placeholder JavaScript functions for dynamic content population
        const ProductPage = {
            // Function to populate product data
            populateProduct: function(productData) {
                // Update title
                document.getElementById('product-title').textContent = productData.title || 'Product Title';
                document.getElementById('product-title-meta').textContent = (productData.title || 'Product') + ' - Sujata Fashion';
                
                // Update price
                document.getElementById('product-price').textContent = productData.price || '₹0.00';
                
                // Update description
                document.getElementById('product-description').innerHTML = productData.description || '<p>No description available.</p>';
                
                // Update main image
                if (productData.mainImage) {
                    document.getElementById('main-product-image').src = productData.mainImage;
                    document.getElementById('main-product-image').alt = productData.title || 'Product Image';
                }
                
                // Populate image gallery
                if (productData.gallery && productData.gallery.length > 0) {
                    this.populateImageGallery(productData.gallery);
                }
                
                // Update meta tags for social sharing
                this.updateMetaTags(productData);
                
                // Update share buttons
                this.updateShareButtons(productData);
            },
            
            // Function to populate image gallery
            populateImageGallery: function(images) {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';
                
                images.forEach((image, index) => {
                    const thumb = document.createElement('img');
                    thumb.src = image;
                    thumb.alt = `Product view ${index + 1}`;
                    thumb.className = 'gallery-thumb';
                    if (index === 0) thumb.classList.add('active');
                    
                    thumb.addEventListener('click', () => {
                        document.getElementById('main-product-image').src = image;
                        document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
                        thumb.classList.add('active');
                    });
                    
                    gallery.appendChild(thumb);
                });
            },
            
            // Function to update meta tags for social sharing
            updateMetaTags: function(productData) {
                const currentUrl = window.location.href;
                
                // Update Open Graph tags
                document.getElementById('og-title').content = productData.title || 'Product';
                document.getElementById('og-description').content = productData.shortDescription || productData.title || 'Check out this product';
                document.getElementById('og-image').content = productData.mainImage || '';
                document.getElementById('og-url').content = currentUrl;
                
                // Update Twitter tags
                document.getElementById('twitter-title').content = productData.title || 'Product';
                document.getElementById('twitter-description').content = productData.shortDescription || productData.title || 'Check out this product';
                document.getElementById('twitter-image').content = productData.mainImage || '';
            },
            
            // Function to update share buttons
            updateShareButtons: function(productData) {
                const currentUrl = encodeURIComponent(window.location.href);
                const title = encodeURIComponent(productData.title || 'Check out this product');
                const description = encodeURIComponent(productData.shortDescription || productData.title || 'Amazing product from Sujata Fashion');
                
                // WhatsApp share
                const whatsappUrl = `https://api.whatsapp.com/send?text=${title}%20-%20${description}%20${currentUrl}`;
                document.getElementById('whatsapp-share').href = whatsappUrl;
                
                // Facebook share
                const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
                document.getElementById('facebook-share').href = facebookUrl;
                
                // Copy link functionality
                document.getElementById('copy-link').addEventListener('click', () => {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        const btn = document.getElementById('copy-link');
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '✅ Copied!';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy link: ', err);
                        alert('Failed to copy link to clipboard');
                    });
                });
            },
            
            // Example function to load product data (replace with actual data fetching)
            loadProduct: function(productId) {
                // This is where you would fetch product data from your backend
                // For now, here's an example of how to use the populate function:
                /*
                const exampleProduct = {
                    title: "Beautiful Saree",
                    price: "₹2,999",
                    shortDescription: "Elegant traditional saree perfect for special occasions",
                    description: "<p>This beautiful saree is crafted with the finest materials...</p>",
                    mainImage: "images/saree-main.jpg",
                    gallery: [
                        "images/saree-1.jpg",
                        "images/saree-2.jpg",
                        "images/saree-3.jpg",
                        "images/saree-4.jpg"
                    ]
                };
                this.populateProduct(exampleProduct);
                */
            }
        };
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Get product ID from URL parameters or other source
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (productId) {
                ProductPage.loadProduct(productId);
            }
            
            // Example: Uncomment to test with sample data
            // ProductPage.populateProduct({
            //     title: "Sample Product",
            //     price: "₹1,999",
            //     shortDescription: "Sample product for testing",
            //     description: "<p>This is a sample product description.</p>",
            //     mainImage: "https://via.placeholder.com/500x500",
            //     gallery: [
            //         "https://via.placeholder.com/500x500/ff0000",
            //         "https://via.placeholder.com/500x500/00ff00",
            //         "https://via.placeholder.com/500x500/0000ff"
            //     ]
            // });
        });
    </script>
</body>
</html>
