<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Sujata Fashion</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .back-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .product-detail {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }
        
        .image-gallery {
            position: relative;
        }
        
        .main-image {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .thumbnail-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        
        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        
        .thumbnail.active {
            border-color: #667eea;
        }
        
        .product-info h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .product-price {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .security-deposit {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 20px;
        }
        
        .product-category {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            color: #666;
        }
        
        .product-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .whatsapp-btn, .facebook-btn, .copy-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            flex: 1;
            min-width: 150px;
        }
        
        .whatsapp-btn {
            background: #25D366;
            color: white;
        }
        
        .facebook-btn {
            background: #1877F2;
            color: white;
        }
        
        .copy-btn {
            background: #6c757d;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .whatsapp-btn, .facebook-btn, .copy-btn {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()">← Back to Products</button>
        
        <div id="product-detail-container">
            <div class="loading">Loading product details...</div>
        </div>
    </div>

    <script src="js/product-page.js"></script>
</body>
</html>
